name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history, to check that the tag is on main.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # publish names the release after package.json's version, and gh creates that tag if it is missing.
      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STORE_TOKEN_SET: ${{ secrets.STORE_PR_TOKEN != '' }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is not package.json's version, $version."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists."
            exit 1
          fi
          if [ "$STORE_TOKEN_SET" != true ]; then
            echo "::error::Set the repository secret STORE_PR_TOKEN."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      # With no argument, rustup installs what rust-toolchain.toml asks for.
      - name: Install the Rust toolchain
        id: rust
        run: |
          rustup --version
          rustup toolchain install --no-self-update
          echo "rustc=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      # A release reads the caches that runs on main wrote, and saves none of its own.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-

      - run: make check

      # The store PR commits and pushes in a clone of the token user's plugins-store fork.
      - name: Prepare the store fork
        env:
          GH_TOKEN: ${{ secrets.STORE_PR_TOKEN }}
        run: |
          gh auth setup-git --hostname github.com
          login=$(gh api user --jq .login)
          id=$(gh api user --jq .id)
          git config --global user.name "$login"
          git config --global user.email "$id+$login@users.noreply.github.com"
          # A stale fork lacks the entry file an earlier store PR merged, so the new PR would conflict.
          if gh repo view "$login/plugins-store" > /dev/null 2>&1; then
            gh repo sync "$login/plugins-store" --branch develop
          fi

      # One build for both: the store entry pins the sha256 of the manifest this release uploads.
      - name: Release and open the store PR
        env:
          GH_TOKEN: ${{ secrets.STORE_PR_TOKEN }}
        run: bunx jensen-plugin publish --release --store-pr
