name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      # With no argument, rustup installs what rust-toolchain.toml asks for.
      - name: Install the Rust toolchain
        id: rust
        run: |
          rustup --version
          rustup toolchain install --no-self-update
          echo "rustc=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # The toolchain floats on stable, so a new Rust release starts a fresh cache.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-

      - run: make check

      # What a release would ship, without releasing anything.
      - name: Build the release files
        run: |
          bunx jensen-plugin publish > "$RUNNER_TEMP/entry.json"
          {
            echo '### Store entry'
            echo '```json'
            cat "$RUNNER_TEMP/entry.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 14
