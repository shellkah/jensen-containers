[package]
name = "containers"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jensen-plugin-backend = { git = "https://github.com/jensen-org/plugin-sdk", tag = "v0.2.0" }
granit-parser = { version = "2.0", default-features = false, features = ["std", "error_messages"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# A panic traps the wasm call, so the backend answers with an error instead.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = "s"
lto = true
strip = true
