services:
  db:
    build:
      context: .
      args:
        DEBIAN_RELEASE: ${DEBIAN_RELEASE}
        PG_MAJOR: ${PG_MAJOR}
        POSTGRESQL_VERSION: ${POSTGRESQL_VERSION}
        TIMESCALEDB_VERSION: ${TIMESCALEDB_VERSION}
        PGVECTOR_VERSION: ${PGVECTOR_VERSION}
    image: app-pg:local
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - app_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ../:/infra:ro
      - ../../db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  app_pgdata:
